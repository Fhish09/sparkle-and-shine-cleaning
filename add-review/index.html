<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write a Review | Sparkle & Shine</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="navbar">
  <div class="brand">Sparkle & Shine</div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="../services.html">Services</a>
    <a href="../testimonials.html">Testimonials</a>
    <a href="../quote.html">Get a Free Quote</a>
  </nav>
</header>

<section class="page-section">
  <div class="container">

    <h2>Share Your Experience</h2>
    <p>Your feedback helps us grow and serve you better.</p>

    <form id="reviewForm" class="review-card">

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label>Your Review</label>
        <textarea id="review" rows="5" required></textarea>
      </div>

      <div class="form-group">
        <label>Rate Our Service</label>
        <div class="rating-stars">
          <label><input type="radio" name="rating" value="5"> ★★★★★</label><br>
          <label><input type="radio" name="rating" value="4"> ★★★★</label><br>
          <label><input type="radio" name="rating" value="3"> ★★★</label><br>
          <label><input type="radio" name="rating" value="2"> ★★</label><br>
          <label><input type="radio" name="rating" value="1"> ★</label>
        </div>
      </div>

      <button type="submit" class="btn full-btn">Submit Review</button>

    </form>

  </div>
</section>

<footer>
  <p>© 2026 Sparkle & Shine Cleaning Services</p>
</footer>


<script type="module">
  import { db } from "../firebase.js";
  import { collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const form = document.getElementById("reviewForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const review = document.getElementById("review").value.trim();
    const rating = document.querySelector('input[name="rating"]:checked')?.value;

    if (!rating) {
      alert("Please select a rating.");
      return;
    }

    try {
      await addDoc(collection(db, "reviews"), {
        name,
        review,
        rating: Number(rating),
        createdAt: serverTimestamp()
      });

      // ✅ Correct redirect (no ../ anymore)
      window.location.href = "/thank-you.html";

    } catch (error) {
      console.error("Error submitting review:", error);
      alert("Something went wrong. Please try again.");
    }
  });
</script>

</div>

</body>
</html>
