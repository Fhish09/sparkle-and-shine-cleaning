<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave a Review | Sparkle & Shine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Sparkle & Shine</h1>
      <nav>
        <a href="../index.html">Home</a>
        <a href="../services.html">Services</a>
        <a href="../testimonials.html">Testimonials</a>
        <a href="../quote.html" class="btn gold-btn">Get a Free Quote</a>
      </nav>
    </div>
  </header>

  <!-- ADD REVIEW SECTION -->
  <section class="add-review-page container">
    <h2>Share Your Experience</h2>
    <p>Your feedback helps us grow and serve you better.</p>

    <form class="review-form">
      
      <label>
        Your Name
        <input type="text" name="name" required>
      </label>

      <label>
        Your Review
        <textarea name="review" rows="5" required></textarea>
      </label>

      <label>
        Rate Our Service
        <div class="star-rating">
          <input type="radio" name="rating" value="5" required> ⭐⭐⭐⭐⭐
          <input type="radio" name="rating" value="4"> ⭐⭐⭐⭐
          <input type="radio" name="rating" value="3"> ⭐⭐⭐
          <input type="radio" name="rating" value="2"> ⭐⭐
          <input type="radio" name="rating" value="1"> ⭐
        </div>
      </label>

      <button type="submit" class="btn gold-btn">
        Submit Review
      </button>

    </form>
  </section>

</body>
</html>
<script type="module">
  import { db } from "../firebase.js";
  import {
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const form = document.getElementById("reviewForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    await addDoc(collection(db, "reviews"), {
      name: form.name.value,
      review: form.review.value,
      rating: form.rating.value,
      createdAt: serverTimestamp()
    });

    alert("Thank you for your review!");
    form.reset();
  });
</script>
