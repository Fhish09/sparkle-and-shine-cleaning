<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Free Cleaning Quote | Sparkle & Shine</title>
  <meta name="description" content="Sparkle & Shine offers professional residential, deep, move-in, and commercial cleaning services in LaSalle and Greater Montréal. Call +1 514-232-5765 for a free quote.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="brand">Sparkle & Shine</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="quote.html" class="active">Request a Quote</a>
  </nav>
</header>

<section class="page-section">
  <div class="container">

    <h2>Request a Free Quote</h2>
    <p>Fast, professional & reliable cleaning services</p>

    <section class="quote-form-section">

      <form
        id="quoteForm"
        action="https://formspree.io/f/maqbrrpe"
        method="POST"
        class="quote-form"
      >

        <label>Service Needed</label>
        <select name="Service" required>
          <option value="">Select service</option>
          <option>Residential Cleaning</option>
          <option>Deep Cleaning</option>
          <option>Move In / Move Out</option>
          <option>Commercial Cleaning</option>
        </select>

        <label>Preferred Date</label>
        <input type="date" name="Preferred Date" required>

        <label>Full Name</label>
        <input type="text" name="Name" required>

        <label>Email Address</label>
        <input type="email" name="Email" required>

        <label>Phone Number</label>
        <input type="tel" name="Phone" required>

        <label>Additional Details</label>
        <textarea name="Details"></textarea>

        <input type="text" name="_gotcha" style="display:none">

        <button type="submit" class="btn" id="submitBtn">
          Submit Request
        </button>

      </form>

    </section>

  </div>
</section>

<footer>
  <p>© 2026 Sparkle & Shine Cleaning Services</p>
</footer>

</body>
</html>
<script type="module">
  import { db } from "./firebase.js";
  import { collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const form = document.getElementById("quoteForm");

  form.addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Quote sent!");
  window.location.href = "thank-you.html";
});

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const service = document.getElementById("service").value;
    const message = document.getElementById("message").value.trim();

    try {
      await addDoc(collection(db, "quotes"), {
        name,
        phone,
        service,
        message,
        createdAt: serverTimestamp()
      });

      // ✅ Redirect after save
      window.location.href = "thank-you.html";

    } catch (error) {
      console.error("Error submitting quote:", error);
      alert("Something went wrong. Please try again.");
    }
  });
</script>
